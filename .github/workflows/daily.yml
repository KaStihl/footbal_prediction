# Runs the prediction pipeline; scheduled + manual (workflow_dispatch).
name: Daily predictions

on:
  schedule:
    - cron: "30 5 * * *"          # every day, 05:30 UTC
    - cron: "15 9 * * 4,5,6,0"    # Thu-Sun refresh: team news, line-ups, odds
  workflow_dispatch:
    inputs:
      no_analyst:
        description: "Skip the Claude analyst (statistical model only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: predictions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-${{ github.run_id }}
          restore-keys: api-

      - name: Build predictions
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          API_FOOTBALL_MAX_CALLS: ${{ vars.API_FOOTBALL_MAX_CALLS }}
          API_FOOTBALL_RPM: ${{ vars.API_FOOTBALL_RPM }}
          ANALYST_MODEL: ${{ vars.ANALYST_MODEL }}
          ANALYST_EFFORT: ${{ vars.ANALYST_EFFORT }}
          ANALYST_MAX_MATCHES: ${{ vars.ANALYST_MAX_MATCHES }}
          ANALYST_ALLOWED_DOMAINS: ${{ vars.ANALYST_ALLOWED_DOMAINS }}
        run: python -m pipeline run ${{ inputs.no_analyst && '--no-analyst' || '' }}

      - name: Commit data
        run: |
          git config user.name "predictions-bot"
          git config user.email "predictions-bot@users.noreply.github.com"
          git add site/data state
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update predictions $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
